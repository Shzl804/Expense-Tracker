{% extends "base.html" %}

{% block title %}Edit Expense — Spendly{% endblock %}

{% block content %}
<section class="auth-section" aria-labelledby="edit-expense-title">
    <div class="auth-container">
        <div class="auth-header">
            <h1 class="auth-title" id="edit-expense-title">Edit expense</h1>
            <p class="auth-subtitle">Update the details of this expense.</p>
        </div>

        <div class="auth-card">
            {% if error %}
            <div class="auth-error" role="alert">{{ error }}</div>
            {% endif %}

            <form method="POST" action="{{ url_for('edit_expense', id=expense.id) }}">
                <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
                <div class="form-group">
                    <label for="amount">Amount</label>
                    <input type="number" id="amount" name="amount"
                           class="form-input" step="0.01" min="0.01"
                           value="{{ amount|default('') }}" required autofocus>
                </div>

                <div class="form-group">
                    <label for="category">Category</label>
                    <select id="category" name="category" class="form-input" required>
                        <option value="" disabled {% if not category %}selected{% endif %}>Choose a category</option>
                        {% for option in categories %}
                        <option value="{{ option }}" {% if category == option %}selected{% endif %}>{{ option }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="form-group">
                    <label for="date">Date</label>
                    <input type="date" id="date" name="date"
                           class="form-input" value="{{ expense_date|default('') }}" required>
                </div>

                <div class="form-group">
                    <label for="description">Description <span aria-hidden="true">(optional)</span></label>
                    <input type="text" id="description" name="description"
                           class="form-input" maxlength="200"
                           value="{{ description|default('') }}">
                </div>

                <button type="submit" class="btn-submit">Save Changes</button>
            </form>
        </div>

        <p class="auth-switch">
            <a href="{{ url_for('profile') }}">Cancel and return to profile</a>
        </p>
    </div>
</section>
{% endblock %}
