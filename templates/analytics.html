{% extends "base.html" %}

{% block title %}Analytics — Spendly{% endblock %}

{% block content %}
<section class="coming-soon-page" aria-labelledby="analytics-page-title">
    <div class="coming-soon-card">
        <div class="corner-shape corner-shape-top" aria-hidden="true"></div>
        <div class="corner-shape corner-shape-bottom" aria-hidden="true"></div>

        <div class="clock-tile" aria-hidden="true">
            <span class="clock-icon"></span>
        </div>

        <div class="status-pill">Coming soon</div>

        <h1 id="analytics-page-title">Advanced Analytics</h1>
        <p class="description">
            We're working on powerful insights and visualizations
            <br class="desktop-break">
            to help you understand your spending patterns
            <br class="desktop-break">
            better.
        </p>

        <div class="progress-dots" aria-hidden="true">
            <span></span>
            <span></span>
            <span></span>
        </div>
        <p class="footer-note">We're crafting something special</p>
    </div>
</section>
{% endblock %}
